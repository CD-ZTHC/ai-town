[tools]
node = "26"

[env]
_.file = ".env"

[tasks.start]
description = "启动 AI 小镇 (http://localhost:3000)"
run = "node server/index.js"

[tasks.dev]
description = "开发模式（文件变更自动重启）"
run = "node --watch-path=server server/index.js"

[tasks.reset]
description = "清空存档，小镇从第一天重新开始"
run = "rm -rf data/save.json data/timelines data/timelines.json && echo '存档与时间线已清除'"

[tasks.public]
description = "以公网模式启动（需在 .env 中设置 ADMIN_TOKEN）"
run = "PUBLIC_MODE=1 node server/index.js"

[tasks.token]
description = "生成一个随机的管理员令牌"
run = "node -e \"console.log('ADMIN_TOKEN=' + require('crypto').randomBytes(24).toString('base64url'))\""

[tasks.check]
description = "语法检查"
run = "node tools/check.js"

[tasks.test]
description = "运行测试（不调用 LLM，使用临时存档目录）"
run = "node --test test/*.test.js"

[tasks.smoke]
description = "用真实模型对每个 AI 模块各调用一次，检查输出与 token 用量（需要 .env 中的 BASE_URL / API_KEY）"
run = "node tools/smoke-llm.js"

[tasks.evolve]
description = "把 AI 心愿单里已采纳的能力缺口整理成需求文档（docs/rfcs/）"
run = "node tools/evolve.js"

[tasks.manifest]
description = "重新生成能力清单 docs/capabilities.md"
run = "node tools/manifest.js"

[tasks.export-mod]
description = "把存档里 AI 创造的内容导出成 Mod（例：mise run export-mod -- --id my-mod --name 我的小镇）"
run = "node tools/export-mod.js"

[tasks.spec]
description = "打印当前默认世界规格（JSON）"
run = "node --input-type=module -e \"import { defaultSpec } from './server/kernel/spec.js'; console.log(JSON.stringify(defaultSpec(), null, 2))\""

[tasks.browser-check]
description = "用本机的无头 Chrome 打开页面，逐个打开主要面板与三种模式，检查控制台错误并截图（前端改动后跑）"
run = "node tools/browser-check.js"
