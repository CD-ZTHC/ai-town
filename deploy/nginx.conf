# 放进 server { ... } 中。示例为子路径 /town/，独立域名时把 location 改为 / 即可
location = /town { return 308 /town/; }

location /town/ {
    proxy_pass http://127.0.0.1:3000/;          # 末尾的 / 会去掉 /town 前缀
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE：关闭缓冲、延长超时
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
}

# 可选：在 Nginx 层再加一道限流
# limit_req_zone $binary_remote_addr zone=town_api:10m rate=5r/s;
# location /town/api/ { limit_req zone=town_api burst=20 nodelay; proxy_pass http://127.0.0.1:3000/api/; ... }
