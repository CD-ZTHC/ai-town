name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22：package.json 声明的最低版本，零依赖（pi-ai 相关测试会跳过）
        # 26：mise.toml 使用的版本，装上可选依赖 pi-ai 一起测
        include:
          - node: 22
            pi: false
          - node: 26
            pi: true
    name: Node ${{ matrix.node }}${{ matrix.pi && ' + pi-ai' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 安装可选依赖 pi-ai
        if: matrix.pi
        run: npm ci --no-audit --no-fund
      - name: 语法检查
        run: node tools/check.js
      - name: 测试（含 7 个游戏日的无头回放，不调用 LLM）
        run: node --test test/*.test.js
      - name: AI 模块流程检查（录制回复，不联网）
        run: node tools/smoke-llm.js --mock
